name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and contract tests
        run: npm test
      - name: Syntax and static checks
        run: npm run lint
      - name: Build editor bundle
        run: npm run bundle:pc
