<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notice Note Mobile</title>
  <link rel="stylesheet" href="./styles.css?v=21">
  <!-- 主题要在首屏前套上 <html data-theme>，否则会先白/先米一下再切 -->
  <script src="./themes.js?v=1"></script>
</head>
<body>
  <main class="app-shell">
    <section id="contentPanel">
      <div class="content-tools">
        <div class="mobile-toolbar">
          <div>
            <h1>Notice Note</h1>
          </div>
          <div class="toolbar-actions">
            <button id="syncButton" class="refresh-button" type="button">同步</button>
            <button id="importPackageButton" class="refresh-button" type="button">导入文件</button>
            <button id="msettingsButton" class="refresh-button" type="button" aria-label="设置">设置</button>
            <input id="packageFileInput" type="file" accept=".notice-note-mobile,application/octet-stream" hidden>
          </div>
        </div>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="标题、正文预览、文件夹">
        </label>
      </div>

      <nav id="pathBar" class="path-bar" aria-label="当前位置"></nav>
      <div id="statusText" class="status-text">正在读取本地文件...</div>
      <div id="noteList" class="note-list"></div>
    </section>

    <section id="noteDetailPanel" class="note-page" hidden>
      <div class="note-page-bar">
        <button id="noteBackButton" class="path-back" type="button">← 返回</button>
        <p id="noteFolder" class="note-page-path"></p>
      </div>
      <article class="note-page-card">
        <div id="noteView">
          <h2 id="noteTitle"></h2>
          <div id="noteContent" class="markdown-body"></div>
        </div>
      </article>
    </section>

    <section id="calendarPanel" class="tab-panel" hidden></section>
    <section id="reviewPanel" class="tab-panel" hidden></section>
    <section id="memoryPanel" class="tab-panel" hidden></section>
  </main>

  <nav id="tabBar" class="tab-bar" aria-label="主导航">
    <button class="tab-item is-active" data-tab="notes" type="button" aria-current="page">
      <span class="tab-icon" aria-hidden="true">📄</span>笔记
    </button>
    <button class="tab-item" data-tab="calendar" type="button">
      <span class="tab-icon" aria-hidden="true">📅</span>日历
    </button>
    <button class="tab-item" data-tab="review" type="button">
      <span class="tab-icon" aria-hidden="true">🔁</span>回顾
    </button>
    <button class="tab-item" data-tab="memory" type="button">
      <span class="tab-icon" aria-hidden="true">🧠</span>记忆
    </button>
  </nav>

  <dialog id="msettingsDialog" class="msettings-dialog" aria-label="设置">
    <div class="msettings-head">
      <h2>设置</h2>
      <button id="closeMsettingsButton" class="image-lightbox-control" type="button" aria-label="关闭设置">×</button>
    </div>

    <section class="msettings-section">
      <h3>界面主题</h3>
      <p class="msettings-status">只改手机端配色，和电脑端各自记住各自的选择。</p>
      <div id="msetThemeList" class="mset-theme-list"></div>
    </section>

    <section class="msettings-section">
      <h3>局域网同步</h3>
      <p id="msetSyncStatus" class="msettings-status" role="status"></p>
      <label class="msettings-field">
        <span>电脑内网 IP</span>
        <input id="msetHostInput" type="text" inputmode="decimal" placeholder="如 192.168.1.23（端口 47820）" autocomplete="off">
      </label>
      <label class="msettings-field">
        <span>配对码（电脑端设置里生成）</span>
        <input id="msetCodeInput" type="text" maxlength="6" placeholder="6 位配对码" autocomplete="off">
      </label>
      <div class="msettings-actions">
        <button id="msetPairButton" class="primary-action" type="button">配对</button>
        <button id="msetSyncButton" class="primary-action" type="button">立即同步</button>
        <button id="msetUnpairButton" class="secondary-action" type="button" hidden>断开配对</button>
      </div>
    </section>

    <section class="msettings-section">
      <h3>AI 判定（记忆卡）</h3>
      <label class="msettings-check">
        <input id="msetAiEnabledInput" type="checkbox">
        <span>作答后由 AI 自动判档（失败退回手动）</span>
      </label>
      <label class="msettings-field">
        <span>API 地址（OpenAI 兼容）</span>
        <input id="msetAiBaseUrlInput" type="url" placeholder="https://qianfan.baidubce.com/v2/tokenplan/personal" autocomplete="off">
      </label>
      <label class="msettings-field">
        <span>模型</span>
        <input id="msetAiModelInput" type="text" placeholder="deepseek-v4.1-flash" autocomplete="off">
      </label>
      <label class="msettings-field">
        <span>API Key（只保存在手机本机）</span>
        <input id="msetAiKeyInput" type="password" placeholder="填写你自己的 Key" autocomplete="off">
      </label>
      <div class="msettings-actions">
        <button id="msetAiSaveButton" class="primary-action" type="button">保存 AI 配置</button>
      </div>
      <p id="msetAiStatus" class="msettings-status" role="status"></p>
    </section>

    <p class="msettings-note">同步与离线包内容均为明文，密码目录在手机端没有密码保护。</p>
  </dialog>

  <div id="syncProgress" class="sync-progress" role="status" aria-live="polite" hidden>
    <div class="sync-progress-card">
      <p id="syncProgressText">正在同步...</p>
      <button id="syncProgressCloseButton" class="secondary-action" type="button" hidden>关闭</button>
    </div>
  </div>

  <div id="imageLightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
    <div class="image-lightbox-zoom-controls" aria-label="图片缩放">
      <button id="zoomOutImageLightboxButton" class="image-lightbox-control" type="button" aria-label="缩小图片">−</button>
      <button id="zoomInImageLightboxButton" class="image-lightbox-control" type="button" aria-label="放大图片">+</button>
    </div>
    <button id="closeImageLightboxButton" class="image-lightbox-close" type="button" aria-label="关闭图片预览">×</button>
    <div id="imageLightboxStage" class="image-lightbox-stage">
      <img id="imageLightboxImage" class="image-lightbox-image" alt="">
    </div>
  </div>

  <script src="./lib/mobile-utils.js?v=3"></script>
  <script src="./lib/shared/date-utils.js?v=1"></script>
  <script src="./lib/shared/memory-types.js?v=1"></script>
  <script src="./lib/shared/sm2-scheduler.js?v=1"></script>
  <script src="./lib/shared/memory-card-store.js?v=1"></script>
  <script src="./lib/shared/ai-judge.js?v=1"></script>
  <script src="./lib/shared/review-queue.js?v=1"></script>
  <script src="./lib/shared/day-index.js?v=2"></script>
  <script src="./lib/shared/sync-merge.js?v=1"></script>
  <script src="./lib/sync-plan.js?v=1"></script>
  <script src="./store.js?v=1"></script>
  <script src="./sync-client.js?v=1"></script>
  <script src="./app.js?v=17"></script>
  <script src="./calendar.js?v=6"></script>
  <script src="./review.js?v=3"></script>
  <script src="./memory.js?v=2"></script>
  <script src="./msettings.js?v=2"></script>
  <script src="./tabs.js?v=4"></script>
</body>
</html>
